version: 2
updates:
  # Version PRs target sandbox (promote to main via PR). Dependabot *security*
  # update PRs may still target the default branch — leave security auto-PRs off
  # in repo Settings if you want to avoid that (see SECURITY.md).
  - package-ecosystem: maven
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    target-branch: sandbox
    labels:
      - dependencies
    ignore:
      - dependency-name: "org.springframework.boot*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    target-branch: sandbox
    labels:
      - dependencies
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    target-branch: sandbox
    labels:
      - dependencies
