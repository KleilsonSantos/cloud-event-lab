name: delivery-observability

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

concurrency:
  group: delivery-ci-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  ingest:
    if: >-
      github.event.workflow_run.conclusion != 'cancelled' &&
      (
        github.event.workflow_run.event == 'pull_request' ||
        github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'sandbox'
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record delivery.ci check conclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/record-delivery-ci.mjs --workflow-run
      - name: Upload delivery-ci artifact
        uses: actions/upload-artifact@v4
        with:
          name: delivery-ci-events-${{ github.event.workflow_run.id }}
          path: delivery-ci-events.jsonl
          if-no-files-found: ignore
          retention-days: 30
