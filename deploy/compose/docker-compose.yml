services:
  postgres:
    image: postgres:16-alpine
    container_name: cel-postgres
    environment:
      POSTGRES_DB: cloudeventlab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      - "5433:5432"
    volumes:
      - cel_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d cloudeventlab"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cel_net

  # Optional: docker compose --profile aws up
  localstack:
    profiles: ["aws"]
    image: localstack/localstack:4.3
    container_name: cel-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,sns,dynamodb
      DEBUG: "0"
    volumes:
      - cel_localstack_data:/var/lib/localstack
    networks:
      - cel_net

  # Optional spike: docker compose --profile aws-floci up
  # LOCAL EMULATOR / OPEN SOURCE ALTERNATIVE (MIT). Exclusive with profile `aws` (same host port 4566).
  # Do not treat as production AWS. Do not assume Floci Azure/GCP images are validated in this lab.
  floci:
    profiles: ["aws-floci"]
    image: floci/floci:1.5.14
    container_name: cel-floci
    ports:
      - "4566:4566"
    volumes:
      - cel_floci_data:/app/data
    networks:
      - cel_net

  # Optional: docker compose --profile azure up
  azurite:
    profiles: ["azure"]
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    container_name: cel-azurite
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - cel_azurite_data:/data
    networks:
      - cel_net

  # Optional: docker compose --profile gcp up
  pubsub:
    profiles: ["gcp"]
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: cel-pubsub
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    networks:
      - cel_net

  # Optional: docker compose --profile otel up
  otel-collector:
    profiles: ["otel"]
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: cel-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - cel_net

networks:
  cel_net:
    name: cel_net

volumes:
  cel_pg_data:
  cel_localstack_data:
  cel_floci_data:
  cel_azurite_data:
