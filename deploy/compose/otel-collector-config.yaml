# Local OpenTelemetry Collector — OPEN SOURCE / LOCAL EMULATOR of a telemetry pipeline.
# Does NOT claim CloudWatch, Application Insights, or Cloud Trace parity (those = REAL_CLOUD).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
