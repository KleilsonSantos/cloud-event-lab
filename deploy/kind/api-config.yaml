apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: cloud-event-lab
type: Opaque
stringData:
  # Lab defaults only — replace for anything beyond local kind. Never commit real secrets.
  SPRING_DATASOURCE_PASSWORD: lab
  LAB_SECURITY_USERNAME: lab
  LAB_SECURITY_PASSWORD: lab-change-me
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: cloud-event-lab
data:
  SPRING_PROFILES_ACTIVE: local
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudeventlab
  SPRING_DATASOURCE_USERNAME: lab
  LAB_STORAGE_FS_ROOT: /data/object-storage
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
