spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:cloudeventlab;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never

lab:
  cloud:
    provider: local
  storage:
    fs:
      root: ${java.io.tmpdir}/cloud-event-lab-test-storage
  security:
    username: lab
    password: lab-change-me
