# Azure profile — Blob via Azurite (LOCAL EMULATOR). Message bus still needs profile `local` until Phase 3.
spring:
  config:
    activate:
      on-profile: azure

lab:
  cloud:
    provider: azure
  azure:
    # Expands to the public Azurite devstoreaccount1 connection (see AzureBlobObjectStorageAdapter).
    storage-connection: UseDevelopmentStorage=true
    blob:
      container: cloud-event-lab
      # Host endpoint when Azurite is published on default compose ports.
      endpoint: http://127.0.0.1:10000/devstoreaccount1
