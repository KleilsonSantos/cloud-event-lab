spring:
  application:
    name: cloud-event-lab-api
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://localhost:5433/cloudeventlab
    username: lab
    password: lab
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

lab:
  cloud:
    provider: local
  storage:
    fs:
      root: ./data/object-storage
  security:
    username: lab
    password: lab-change-me

server:
  port: 8080

logging:
  level:
    root: INFO
    dev.kleilson.cloudeventlab: INFO
