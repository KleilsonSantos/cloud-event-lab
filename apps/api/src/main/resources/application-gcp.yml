# GCP profile — Pub/Sub emulator (LOCAL EMULATOR).
# GCS object storage: FS APPROX (lab.cloud.provider=gcp) or REAL_CLOUD later.
spring:
  config:
    activate:
      on-profile: gcp

lab:
  cloud:
    provider: gcp
  gcp:
    project-id: cloud-event-lab-local
    pubsub-emulator-host: localhost:8085
