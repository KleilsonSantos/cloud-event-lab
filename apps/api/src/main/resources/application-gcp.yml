# GCP profile — Pub/Sub emulator via PUBSUB_EMULATOR_HOST (LOCAL EMULATOR).
# GCS object storage: no full official emulator for apps → FS APPROX (lab.cloud.provider=gcp)
# or REAL_CLOUD later. Do not claim GCS parity.
spring:
  config:
    activate:
      on-profile: gcp

lab:
  cloud:
    provider: gcp
  gcp:
    project-id: cloud-event-lab-local
    pubsub-emulator-host: localhost:8085
