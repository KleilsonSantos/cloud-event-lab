# AWS profile — S3 + SQS via LocalStack (LOCAL EMULATOR).
spring:
  config:
    activate:
      on-profile: aws

lab:
  cloud:
    provider: aws
  aws:
    endpoint: http://localhost:4566
    region: us-east-1
    access-key-id: test
    secret-access-key: test
    use-static-credentials: true
    s3:
      bucket: cloud-event-lab
    sqs:
      wait-seconds: 5
      visibility-seconds: 30
    # Hobby LocalStack may require LOCALSTACK_AUTH_TOKEN in the environment — see docs/aws/README.md.
    # Do not commit secrets.
