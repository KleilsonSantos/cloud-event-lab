# AWS profile — S3 via LocalStack (LOCAL EMULATOR). Message bus still needs profile `local` until Phase 3.
spring:
  config:
    activate:
      on-profile: aws

lab:
  cloud:
    provider: aws
  aws:
    endpoint: http://localhost:4566
    region: us-east-1
    access-key-id: test
    secret-access-key: test
    use-static-credentials: true
    s3:
      bucket: cloud-event-lab
    # Hobby LocalStack may require LOCALSTACK_AUTH_TOKEN in the environment — see docs/aws/README.md.
    # Do not commit secrets.
